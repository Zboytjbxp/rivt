name: Gate A Safety

on:
  pull_request:
  push:
    branches:
      - master
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: gate-a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # The serial PostgreSQL safety suite currently takes about 25 minutes.
    # Keep a real ceiling without terminating the gate before it can finish.
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: rivt_test
          POSTGRES_PASSWORD: rivt_test
          POSTGRES_DB: rivt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rivt_test -d rivt_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://rivt_test:rivt_test@127.0.0.1:5432/rivt_test
      PGSSL: disable
      # postgres:16-alpine defaults to 100 total slots with 3 reserved.
      RIVT_DB_MAX_CONNECTIONS: 97

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Lint repository
        run: npm run lint

      - name: Run unit and integration tests
        run: npm run test

      - name: Require current launch-readiness evidence
        id: launch_readiness
        continue-on-error: true
        run: npm run launch:readiness -- --require-ready

      - name: Run fail-closed authentication browser test
        run: node test/auth-fail-closed.e2e.mjs

      - name: Run jobs and discovery browser test
        shell: bash
        run: |
          set +e
          output="$(node test/jobs-discovery.e2e.mjs 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            summary="$(printf '%s\n' "$output" | tail -n 16 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/:/%3A/g')"
            echo "::error file=test/jobs-discovery.e2e.mjs,title=Jobs and discovery browser failure::$summary"
          fi
          exit "$status"

      - name: Run offline recovery browser test
        run: node test/offline-recovery.e2e.mjs

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Enforce launch-readiness result after verification
        if: always()
        shell: bash
        env:
          RIVT_LAUNCH_READINESS_OUTCOME: ${{ steps.launch_readiness.outcome }}
        run: |
          set -euo pipefail
          if [[ "$RIVT_LAUNCH_READINESS_OUTCOME" != "success" ]]; then
            echo "Launch readiness remains blocked. Review the earlier readiness step for the exact findings."
            exit 1
          fi
