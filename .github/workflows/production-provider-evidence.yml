name: Production Provider Evidence

on:
  workflow_dispatch:
    inputs:
      evidence_commit:
        description: Full current production-evidence-overlay SHA containing only allowlisted evidence updates
        required: true
        type: string
      approval_commit:
        description: Full protected production-launch-approval SHA (required only for launch-ready mode)
        required: false
        type: string
      mode:
        description: Verify provider controls only, or require full launch readiness
        required: true
        default: providers-only
        type: choice
        options:
          - providers-only
          - launch-ready

permissions:
  contents: read
  actions: read
  issues: read

concurrency:
  group: production-provider-evidence
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.repository == 'Zboytjbxp/rivt' &&
      github.ref == 'refs/heads/production-evidence-source' &&
      github.event.repository.default_branch == 'master' &&
      github.ref_protected == true &&
      github.ref_name == 'production-evidence-source'
    # Temporary combined provider verification is permitted only behind the
    # production-evidence environment's required human approval and deployment-
    # branch restriction to production-evidence-source. The workflow itself is
    # therefore loaded from S; E comes from the separately protected,
    # non-Railway production-evidence-overlay branch and is data only.
    # Keep this job read-only and limit credentials to the adapters compiled
    # below until each provider can be split into an independently approved job.
    environment: production-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate immutable source and evidence revisions
        shell: bash
        env:
          RIVT_APPROVAL_COMMIT: ${{ inputs.approval_commit }}
          RIVT_EVIDENCE_COMMIT: ${{ inputs.evidence_commit }}
          RIVT_PROVIDER_EVIDENCE_MODE: ${{ inputs.mode }}
          RIVT_PRODUCTION_SOURCE_COMMIT: ${{ vars.RIVT_PRODUCTION_SOURCE_COMMIT }}
        run: |
          set -euo pipefail
          if [[ ! "$RIVT_PRODUCTION_SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Trusted production source commit is missing or invalid."
            exit 1
          fi
          if [[ ! "$RIVT_EVIDENCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Evidence commit is missing or invalid."
            exit 1
          fi
          if [[ "$RIVT_PRODUCTION_SOURCE_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "This workflow must run from the protected source branch pinned to the deployed commit."
            exit 1
          fi
          if [[ "$RIVT_EVIDENCE_COMMIT" == "$RIVT_PRODUCTION_SOURCE_COMMIT" ]]; then
            echo "Evidence commit must follow the deployed source commit."
            exit 1
          fi
          case "$RIVT_PROVIDER_EVIDENCE_MODE" in
            providers-only)
              if [[ -n "$RIVT_APPROVAL_COMMIT" ]]; then
                echo "Provider-only verification must not accept an approval commit."
                exit 1
              fi
              ;;
            launch-ready)
              if [[ ! "$RIVT_APPROVAL_COMMIT" =~ ^[a-f0-9]{40}$ ]]; then
                echo "Launch-ready verification requires a full approval commit."
                exit 1
              fi
              if [[ "$RIVT_APPROVAL_COMMIT" == "$RIVT_EVIDENCE_COMMIT" || "$RIVT_APPROVAL_COMMIT" == "$RIVT_PRODUCTION_SOURCE_COMMIT" ]]; then
                echo "Approval commit must follow and remain distinct from source and evidence."
                exit 1
              fi
              ;;
            *)
              echo "Provider evidence mode is invalid."
              exit 1
              ;;
          esac

      - name: Verify evidence and approval branches are protected
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RIVT_PROVIDER_EVIDENCE_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          verify_protected_branch() {
            local branch_name="$1"
            local protected
            protected="$(gh api \
              --method GET \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "repos/$GITHUB_REPOSITORY/branches/$branch_name" \
              --jq '.protected')"
            if [[ "$protected" != "true" ]]; then
              echo "Required trust-root branch '$branch_name' is not protected."
              exit 1
            fi
          }
          verify_protected_branch "production-evidence-overlay"
          if [[ "$RIVT_PROVIDER_EVIDENCE_MODE" == "launch-ready" ]]; then
            verify_protected_branch "production-launch-approval"
          fi

      - name: Check out immutable deployed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          path: source
          persist-credentials: false
          ref: ${{ vars.RIVT_PRODUCTION_SOURCE_COMMIT }}

      - name: Check out protected evidence overlay
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          path: evidence
          persist-credentials: false
          ref: refs/heads/production-evidence-overlay

      - name: Check out protected post-evidence approval overlay
        if: inputs.mode == 'launch-ready'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          path: approval
          persist-credentials: false
          ref: refs/heads/production-launch-approval

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: source/.nvmrc
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Validate evidence-only overlay before dependencies or provider credentials
        shell: bash
        env:
          RIVT_EVIDENCE_COMMIT: ${{ inputs.evidence_commit }}
          RIVT_PROVIDER_EVIDENCE_PLAN_JSON: ${{ secrets.RIVT_PROVIDER_EVIDENCE_PLAN_JSON }}
          RIVT_PRODUCTION_SOURCE_COMMIT: ${{ vars.RIVT_PRODUCTION_SOURCE_COMMIT }}
        run: |
          set -euo pipefail
          source_root="$GITHUB_WORKSPACE/source"
          evidence_root="$GITHUB_WORKSPACE/evidence"
          if [[ "$(git -C "$source_root" rev-parse HEAD)" != "$RIVT_PRODUCTION_SOURCE_COMMIT" ]]; then
            echo "Checked-out source does not match the deployed source contract."
            exit 1
          fi
          overlay_branch_ref="refs/remotes/origin/production-evidence-overlay"
          if ! git -C "$evidence_root" show-ref --verify --quiet "$overlay_branch_ref"; then
            echo "The protected production-evidence-overlay branch was not fetched."
            exit 1
          fi
          if [[ "$(git -C "$evidence_root" rev-parse "$overlay_branch_ref")" != "$RIVT_EVIDENCE_COMMIT" ]]; then
            echo "Evidence commit must match the protected overlay branch head."
            exit 1
          fi
          if [[ "$(git -C "$evidence_root" rev-parse HEAD)" != "$RIVT_EVIDENCE_COMMIT" ]]; then
            echo "Evidence commit must be the current production-evidence-overlay head."
            exit 1
          fi
          node "$source_root/scripts/provider-evidence-overlay.js" \
            --json \
            --require-plan \
            --root "$evidence_root" \
            --source-commit "$RIVT_PRODUCTION_SOURCE_COMMIT" \
            --evidence-commit "$RIVT_EVIDENCE_COMMIT"
          echo "RIVT_EVIDENCE_ROOT=$evidence_root" >> "$GITHUB_ENV"

      - name: Validate protected approval revision before dependencies or provider credentials
        if: inputs.mode == 'launch-ready'
        shell: bash
        env:
          RIVT_APPROVAL_COMMIT: ${{ inputs.approval_commit }}
          RIVT_EVIDENCE_COMMIT: ${{ inputs.evidence_commit }}
          RIVT_PROVIDER_EVIDENCE_PLAN_JSON: ${{ secrets.RIVT_PROVIDER_EVIDENCE_PLAN_JSON }}
          RIVT_PRODUCTION_SOURCE_COMMIT: ${{ vars.RIVT_PRODUCTION_SOURCE_COMMIT }}
        run: |
          set -euo pipefail
          approval_root="$GITHUB_WORKSPACE/approval"
          evidence_root="$GITHUB_WORKSPACE/evidence"
          source_root="$GITHUB_WORKSPACE/source"
          approval_branch_ref="refs/remotes/origin/production-launch-approval"
          if ! git -C "$approval_root" show-ref --verify --quiet "$approval_branch_ref"; then
            echo "The protected production-launch-approval branch was not fetched."
            exit 1
          fi
          if [[ "$(git -C "$approval_root" rev-parse "$approval_branch_ref")" != "$RIVT_APPROVAL_COMMIT" ]]; then
            echo "Approval commit must match the protected approval branch head."
            exit 1
          fi
          if [[ "$(git -C "$approval_root" rev-parse HEAD)" != "$RIVT_APPROVAL_COMMIT" ]]; then
            echo "Approval checkout does not match the requested approval revision."
            exit 1
          fi
          if ! git -C "$approval_root" merge-base --is-ancestor "$RIVT_EVIDENCE_COMMIT" "$RIVT_APPROVAL_COMMIT"; then
            echo "Approval commit must descend from the exact evidence commit."
            exit 1
          fi
          node "$source_root/scripts/provider-approval-overlay.js" \
            --json \
            --source-commit "$RIVT_PRODUCTION_SOURCE_COMMIT" \
            --policy-root "$source_root" \
            --evidence-commit "$RIVT_EVIDENCE_COMMIT" \
            --evidence-root "$evidence_root" \
            --approval-commit "$RIVT_APPROVAL_COMMIT" \
            --approval-root "$approval_root"
          echo "RIVT_APPROVAL_ROOT=$approval_root" >> "$GITHUB_ENV"

      - name: Install locked dependencies without lifecycle scripts
        working-directory: source
        run: npm ci --ignore-scripts

      - name: Verify production provider evidence without persistent mutation
        shell: bash
        working-directory: source
        env:
          RIVT_EVIDENCE_GITHUB_TOKEN: ${{ github.token }}
          RIVT_EVIDENCE_RAILWAY_TOKEN: ${{ secrets.RIVT_EVIDENCE_RAILWAY_TOKEN }}
          RIVT_EVIDENCE_SENTRY_TOKEN: ${{ secrets.RIVT_EVIDENCE_SENTRY_TOKEN }}
          RIVT_EVIDENCE_COMMIT: ${{ inputs.evidence_commit }}
          RIVT_APPROVAL_COMMIT: ${{ inputs.approval_commit }}
          RIVT_PROVIDER_EVIDENCE_MODE: ${{ inputs.mode }}
          RIVT_PRODUCTION_SOURCE_COMMIT: ${{ vars.RIVT_PRODUCTION_SOURCE_COMMIT }}
          RIVT_PROVIDER_EVIDENCE_PLAN_JSON: ${{ secrets.RIVT_PROVIDER_EVIDENCE_PLAN_JSON }}
        run: |
          set -euo pipefail
          if [[ ! "$RIVT_PRODUCTION_SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Trusted production source commit is missing or invalid."
            exit 1
          fi
          if [[ -z "$RIVT_PROVIDER_EVIDENCE_PLAN_JSON" ]]; then
            echo "Protected provider evidence plan is not configured."
            exit 1
          fi
          approval_args=()
          case "$RIVT_PROVIDER_EVIDENCE_MODE" in
            providers-only) verification_mode="--verify-providers-only" ;;
            launch-ready)
              verification_mode="--require-ready"
              approval_args=(
                --approval-commit "$RIVT_APPROVAL_COMMIT"
                --approval-root "$RIVT_APPROVAL_ROOT"
              )
              ;;
            *)
              echo "Provider evidence mode is invalid."
              exit 1
              ;;
          esac
          node scripts/provider-evidence-runner.js \
            --read-only \
            "$verification_mode" \
            --json \
            --evidence-commit "$RIVT_EVIDENCE_COMMIT" \
            --evidence-root "$RIVT_EVIDENCE_ROOT" \
            --source-commit "$RIVT_PRODUCTION_SOURCE_COMMIT" \
            --expected-live-commit "$RIVT_PRODUCTION_SOURCE_COMMIT" \
            "${approval_args[@]}"
